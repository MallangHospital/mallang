<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>건의사항 관리자 페이지</title>

    <link rel="stylesheet" href="assets/globalstyle.css" />
    <link rel="stylesheet" href="assets/navbar_admin.css" />
    <link rel="stylesheet" href="style_service_admin.css" />
    <link rel="stylesheet" href="assets/footer.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <script src="assets/jquery-3.7.1.min.js"></script>
    <script defer src="assets/script_admin.js"></script>
  </head>
  <body>
    <div class="wrap">
      <div id="navbar"></div>
      <div class="admin-panel-container">
        <h1 class="admin-panel-header">고객의 소리</h1>
        <table class="admin-table" id="suggestions-table">
          <thead>
            <tr>
              <th>제목</th>
              <th>작성자</th>
              <th>전화번호</th>
              <th>작성일시</th>
              <th>상세보기</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <script>
        // 건의사항 목록 가져오기
        async function fetchFeedbacks() {
          try {
            // Spring Boot 엔드포인트 호출
            const response = await fetch('/feedbacks');
            if (!response.ok) {
              throw new Error('데이터를 가져오는 데 실패했습니다.');
            }

            // JSON 데이터 파싱
            const feedbacks = await response.json();

            // 테이블에 데이터 표시
            const tableBody = document.querySelector('#feedbacks-table tbody');
            tableBody.innerHTML = ''; // 기존 데이터 초기화

            if (feedbacks.length === 0) {
              document.getElementById('no-data-message').style.display =
                'block';
              return;
            }

            document.getElementById('no-data-message').style.display = 'none';

            // 데이터 추가
            feedbacks.forEach((feedback) => {
              const row = document.createElement('tr');
              row.innerHTML = `
        <td>${feedback.title}</td>
        <td>${feedback.name}</td>
        <td>${feedback.phoneNumber}</td>
        <td>${new Date(feedback.createdAt).toLocaleString()}</td>
        <td>${feedback.content}</td>
      `;
              tableBody.appendChild(row);
            });
          } catch (error) {
            console.error(error.message);
            alert('건의사항 목록을 불러오는 중 오류가 발생했습니다.');
          }
        }

        function viewDetails(id) {
          window.location.href = `/suggestion-details.html?id=${id}`;
        }

        fetchFeedbacks();
      </script>
      <div id="footer"></div>
    </div>
  </body>
</html>
